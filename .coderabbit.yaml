# CodeRabbit configuration
# Schema: https://docs.coderabbit.ai/reference/configuration
language: en-US

reviews:
  # dev/incompressible_liquids/json/* are generated coefficient-data files,
  # not code -- nothing there benefits from review comments. (Note: this
  # does NOT count against CodeRabbit's per-PR file-count cap, which is
  # computed on the raw diff before path_filters apply; it only trims what
  # gets reviewed once a PR is under the cap.)
  path_filters:
    - "!dev/incompressible_liquids/json/**"
  # Project-wide guidance for the reviewer.
  path_instructions:
    - path: "**"
      instructions: >
        Do not comment on identifier naming conventions or casing style.
        In particular, never suggest renaming identifiers to camelCase, and
        do not flag snake_case, PascalCase, or other casing as an issue.
        Naming style is a deliberate project choice and is out of scope for
        review.
