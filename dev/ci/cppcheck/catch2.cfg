<?xml version="1.0"?>
<!--
  cppcheck library config for the Catch2 test macros (COO-137).

  cppcheck is run without Catch2's headers on its include path, so it sees
  TEST_CASE / TEST_CASE_METHOD as unknown macros and guesses at what they
  are.  Inside a namespace it guesses wrong and reports a whole-file
  syntaxError, after which nothing in the file is analysed.  These defines
  give it a parseable stand-in: a plain function for TEST_CASE, and a
  member function of a class derived from the fixture for TEST_CASE_METHOD,
  so the fixture's members resolve in the test body.  The class name carries
  __LINE__, or every test case in a file binds to the first fixture's members;
  it also sits in an anonymous namespace, or two files reusing a name trip
  cppcheck's cross-file ctuOneDefinitionRuleViolation.

  Used by dev/ci/preflight.sh and the cppcheck job in
  .github/workflows/dev_checks.yml.  If a new Catch2 macro produces a
  syntaxError, add it here; do not suppress syntaxError.
-->
<def format="2">
  <define name="TEST_CASE(...)" value="void cppcheck_catch_test_case()"/>
  <define name="CPPCHECK_CATCH_CAT2(a,b)" value="a##b"/>
  <define name="CPPCHECK_CATCH_CAT(a,b)" value="CPPCHECK_CATCH_CAT2(a,b)"/>
  <define name="TEST_CASE_METHOD(F,...)" value="namespace { struct CPPCHECK_CATCH_CAT(cppcheck_catch_case_method_,__LINE__) : F { void test(); }; } void CPPCHECK_CATCH_CAT(cppcheck_catch_case_method_,__LINE__)::test()"/>
</def>
