name: Packaging (offline build)

# Keeps the Linux packaging path honest.  See GH #3388: the 2014 wrappers/DEB
# attempt broke the day a cmake-format pass removed a space and nobody found
# out for twelve years, because no CI job ran it.  This job builds CoolProp the
# way OBS, sbuild and mock do -- from the release tarball, in a sandbox with no
# network -- so a regression in dependency handling or the install layout shows
# up on the commit that caused it.

on:
  push:
    branches: [ 'master', 'main', 'develop' ]
    tags: [ 'v*' ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'dev/packaging/**'
      - 'dev/generate_headers.py'
      - '.github/workflows/packaging_offline.yml'
  pull_request:
    branches: [ 'master', 'main', 'develop' ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'dev/packaging/**'
      - 'dev/generate_headers.py'
      - '.github/workflows/packaging_offline.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  offline-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The FHS install work makes CMAKE_INSTALL_PREFIX actually take effect,
      # which is one edit away from making the DEFAULT prefix stop working --
      # and every wrapper build job reads install_root/ without ever passing a
      # prefix, so nothing else here would notice.  Configure both ways and
      # check both answers.
      - name: Check the install prefix defaults
        run: |
          set -euo pipefail
          expect_prefix() {
            local build="$1" want="$2"; shift 2
            if ! cmake -S . -B "${build}" -DCOOLPROP_SHARED_LIBRARY=ON "$@" > "${build}.log" 2>&1; then
              echo "configure failed for [$*]:" >&2
              cat "${build}.log" >&2
              exit 1
            fi

            local got
            got="$(sed -n 's/^CMAKE_INSTALL_PREFIX:PATH=//p' "${build}/CMakeCache.txt")"
            if [ "${got}" != "${want}" ]; then
              echo "CMAKE_INSTALL_PREFIX check failed for [$*]: want '${want}', got '${got}'" >&2
              exit 1
            fi

            # Only CMAKE_INSTALL_PREFIX is asserted now.  Before #3311 the
            # release-artifact rules interpolated ${COOLPROP_INSTALL_PREFIX}
            # into four absolute DESTINATIONs, so that variable needed its own
            # check; #3311 made every DESTINATION relative, so the cache entry
            # above is the single thing that decides where anything lands.
            echo "ok: [$*] -> ${got}"
          }
          expect_prefix "${RUNNER_TEMP}/pfx-default" "${GITHUB_WORKSPACE}/install_root"
          expect_prefix "${RUNNER_TEMP}/pfx-explicit" "/usr" -DCMAKE_INSTALL_PREFIX=/usr
          expect_prefix "${RUNNER_TEMP}/pfx-legacy" "/opt/cp" -DCOOLPROP_INSTALL_PREFIX=/opt/cp
          # Both empty forms, which is what an unset shell variable expands to in
          # `cmake -DCOOLPROP_INSTALL_PREFIX="$PREFIX"`.  Each must fall back to
          # the default rather than leaving the prefix empty: an empty prefix
          # sends every relative DESTINATION to /lib and /include, and the four
          # rules that interpolate COOLPROP_INSTALL_PREFIX to the filesystem
          # root.  Asserting only the three cases above let exactly that through.
          # Both empty forms ABORT since #3311 landed; they used to fall back to
          # install_root.  Asserted below with expect_configure_failure.
          # Trailing slash, through both variables.  A PATH cache entry is
          # normalised on the way in and an untyped -D is not, so a prefix as
          # ordinary as "$PREFIX/" once left the two variables disagreeing and
          # aborted the configure.  Assert the normalised value.
          expect_prefix "${RUNNER_TEMP}/pfx-slash-legacy" "/opt/cp" -DCOOLPROP_INSTALL_PREFIX=/opt/cp/
          expect_prefix "${RUNNER_TEMP}/pfx-slash-cmake" "/usr" -DCMAKE_INSTALL_PREFIX=/usr/

          # A prefix that collapses to nothing must ABORT, not configure.  This
          # is the other half of the same guard: ";" expands to zero arguments,
          # which writes an empty prefix that would send every relative
          # DESTINATION to /lib and /include.
          expect_configure_failure() {
            local build="$1"; shift
            if cmake -S "${GITHUB_WORKSPACE}" -B "${build}" "$@" > "${build}.log" 2>&1; then
              echo "expected the configure to fail for [$*], but it succeeded" >&2
              exit 1
            fi
            if ! grep -q "must not be empty" "${build}.log"; then
              echo "configure failed for [$*] but not with the prefix guard:" >&2
              tail -20 "${build}.log" >&2
              exit 1
            fi
            echo "ok: [$*] -> aborted as expected"
          }
          expect_configure_failure "${RUNNER_TEMP}/pfx-collapse-legacy" "-DCOOLPROP_INSTALL_PREFIX=;"
          expect_configure_failure "${RUNNER_TEMP}/pfx-collapse-cmake" "-DCMAKE_INSTALL_PREFIX=;"
          expect_configure_failure "${RUNNER_TEMP}/pfx-empty-legacy" "-DCOOLPROP_INSTALL_PREFIX="
          expect_configure_failure "${RUNNER_TEMP}/pfx-empty-cmake" "-DCMAKE_INSTALL_PREFIX="

      - name: Build the offline release tarball
        run: dev/packaging/make-release-tarball.sh --output-dir "${RUNNER_TEMP}/dist"

      - name: Unpack the tarball
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/src"
          tar -x -f "${RUNNER_TEMP}"/dist/coolprop-*.tar.gz -C "${RUNNER_TEMP}/src"
          # Exactly one top-level directory is expected; anything else means the
          # tarball layout changed and the steps below would silently guess.
          mapfile -t roots < <(find "${RUNNER_TEMP}/src" -mindepth 1 -maxdepth 1 -type d)
          if [ "${#roots[@]}" -ne 1 ]; then
            echo "expected one directory in the tarball, found ${#roots[@]}" >&2
            printf '%s\n' "${roots[@]}" >&2
            exit 1
          fi
          echo "COOLPROP_SRC=${roots[0]}" >> "${GITHUB_ENV}"

      # COOLPROP_VENDOR_THIRD_PARTY=OFF makes cmake/dependencies.cmake resolve
      # Eigen and fmt with find_package instead of CPM, so they have to come
      # from the system.  They are installed here, before the network is taken
      # away, because that is exactly how a distribution build works: sbuild,
      # mock and OBS install the declared BuildRequires into the chroot first
      # and only then cut the network.  These two packages are the build-time
      # half of the dependencies libcoolprop-devel and libcoolprop-dev already
      # declare at install time.
      - name: Install the build dependencies the distribution recipes declare
        run: |
          set -euo pipefail
          # Fail if the four copies of the dependency list have drifted apart.
          # Installing the right packages here while a recipe has lost one is
          # exactly how this job went green on a build that was broken for
          # Debian, so the check runs before the install, not after it.
          python3 dev/packaging/check-build-deps.py
          # Error-Mode=any turns a partially failed index refresh into a
          # failure.  Plain "apt-get update" exits 0 when some sources fail and
          # the install then silently resolves against a stale package list.
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y libeigen3-dev libfmt-dev

      - name: Build and install with the network switched off
        run: |
          set -euo pipefail
          # Written to a file rather than passed to bash -c, so that the quoting
          # stays readable and the variables below are plain shell variables.
          cat > "${RUNNER_TEMP}/offline-build.sh" <<'SCRIPT'
          set -euo pipefail
          cmake -S "${COOLPROP_SRC}" -B "${RUNNER_TEMP}/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCOOLPROP_SHARED_LIBRARY=ON \
            -DCOOLPROP_INSTALL_CMAKE_PACKAGE=ON \
            -DCOOLPROP_INSTALL_LEGACY_LAYOUT=OFF \
            -DCOOLPROP_INSTALL_FLAT_HEADERS=OFF \
            -DCOOLPROP_VENDOR_THIRD_PARTY=OFF \
            -DCOOLPROP_REQUIRE_VENDORED_DEPS=ON \
            -DCOOLPROP_NO_EXAMPLES=ON
          cmake --build "${RUNNER_TEMP}/build" -j "$(nproc)"
          DESTDIR="${RUNNER_TEMP}/destdir" cmake --install "${RUNNER_TEMP}/build"
          SCRIPT

          # "unshare --net" gives the build a network namespace with nothing in
          # it, the same situation as an OBS or sbuild chroot.  Anything that
          # still reaches for the network fails here; there is no fallback to
          # the host network, and no "keep going" branch.
          sudo --preserve-env=COOLPROP_SRC,RUNNER_TEMP \
            unshare --net -- bash "${RUNNER_TEMP}/offline-build.sh"

      - name: Check the installed layout
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/destdir/usr"

          # Find the library rather than assuming a libdir name, but insist on
          # exactly one match: two would mean the install rules are firing
          # twice, which is as much of a bug as none at all.
          mapfile -t sonames < <(find "${root}" -name 'libCoolProp.so' -type l)
          if [ "${#sonames[@]}" -ne 1 ]; then
            echo "expected exactly one libCoolProp.so symlink, found ${#sonames[@]}" >&2
            printf '%s\n' "${sonames[@]:-(none)}" >&2
            exit 1
          fi
          libdir="$(dirname "${sonames[0]}")"
          echo "libdir: ${libdir#"${root}"}"

          for f in \
              "${libdir}/libCoolProp.so.8" \
              "${libdir}/pkgconfig/coolprop.pc" \
              "${libdir}/cmake/CoolProp/CoolPropConfig.cmake" \
              "${libdir}/cmake/CoolProp/CoolPropTargets.cmake" \
              "${root}/include/CoolProp/CoolProp.h" \
              "${root}/include/CoolProp/CoolPropLib.h" ; do
            if [ ! -e "${f}" ]; then
              echo "missing from the install: ${f}" >&2
              exit 1
            fi
          done

          # The flat deprecation shims must stay out of /usr/include: names like
          # Solvers.h, MatrixMath.h and Exceptions.h are far too generic to
          # share a system include directory with other packages.
          stray="$(find "${root}/include" -maxdepth 1 -name '*.h' -printf '%f\n')"
          if [ -n "${stray}" ]; then
            echo "flat headers leaked into the include root:" >&2
            echo "${stray}" >&2
            exit 1
          fi

          echo "COOLPROP_INSTALL_ROOT=${root}" >> "${GITHUB_ENV}"
          echo "COOLPROP_INSTALL_LIBDIR=${libdir}" >> "${GITHUB_ENV}"

      - name: Build a consumer against the install
        run: |
          set -euo pipefail
          root="${COOLPROP_INSTALL_ROOT}"
          libdir="${COOLPROP_INSTALL_LIBDIR}"
          work="${RUNNER_TEMP}/consumer"
          mkdir -p "${work}"

          # The C API only, so this checks the packaged library and headers
          # without dragging Eigen into the test.
          cat > "${work}/main.c" <<'EOF'
          #include <CoolProp/CoolPropLib.h>
          #include <stdio.h>
          #include <stdlib.h>

          int main(void) {
              /* Normal boiling point of water, expected near 373.12 K. */
              double T_sat_K = PropsSI("T", "P", 101325.0, "Q", 0.0, "Water");
              printf("T_sat_K = %.4f\n", T_sat_K);
              if (!(T_sat_K > 372.0 && T_sat_K < 374.0)) {
                  fprintf(stderr, "unexpected saturation temperature\n");
                  return 1;
              }
              return 0;
          }
          EOF

          # Check the prefix that was actually baked into the .pc before
          # overriding it below.  Without this, a coolprop.pc generated with a
          # wrong prefix would still sail through the compile, because the
          # override replaces exactly the value under test.
          if ! grep -qx 'prefix=/usr' "${libdir}/pkgconfig/coolprop.pc"; then
            echo "coolprop.pc has the wrong baked-in prefix:" >&2
            grep '^prefix=' "${libdir}/pkgconfig/coolprop.pc" >&2
            exit 1
          fi

          echo "== via pkg-config =="
          export PKG_CONFIG_PATH="${libdir}/pkgconfig"
          # The .pc has prefix=/usr baked in, but this is a DESTDIR install, so
          # point it at the staging root.  NOT --define-prefix: that recomputes
          # the prefix by stripping two components from the .pc file's
          # directory, which is wrong whenever libdir is multiarch
          # (lib/x86_64-linux-gnu/pkgconfig is three), and yields
          # -I<root>/lib/include.
          cflags="$(pkg-config --define-variable=prefix="${root}" --cflags coolprop)"
          libs="$(pkg-config --define-variable=prefix="${root}" --libs coolprop)"
          echo "cflags: ${cflags}"
          echo "libs:   ${libs}"
          # Unquoted on purpose: pkg-config hands back several arguments in one
          # string and they have to word-split.  Quoting passes "-I... -L... -l..."
          # as a single argument and the compile fails.
          # shellcheck disable=SC2086
          cc "${work}/main.c" ${cflags} ${libs} -o "${work}/consumer_pc"
          LD_LIBRARY_PATH="${libdir}" "${work}/consumer_pc"

          # The C API needs no third-party header, so compiling only it hides
          # a .pc that fails to name Eigen and fmt.  The installed C++ headers
          # do include them, so build a C++ consumer through pkg-config too.
          # dev/ci/cmake-consumer/cpp_api.cpp includes numerics/PolyMath.h
          # precisely to pull the transitive Eigen include in, so it fails
          # when the flags are incomplete.
          #
          # This build asks for COOLPROP_VENDOR_THIRD_PARTY=OFF, so the
          # library compiled against the system Eigen and fmt and coolprop.pc
          # has to require them; with vendoring ON the .pc names the bundled
          # copies in Cflags instead.  Assert the shape that matches this
          # build before relying on the compile.
          if ! grep -qx 'Requires: eigen3 fmt' "${libdir}/pkgconfig/coolprop.pc"; then
            echo "coolprop.pc does not require the system Eigen and fmt that" >&2
            echo "COOLPROP_VENDOR_THIRD_PARTY=OFF made it compile against:" >&2
            grep -E '^(Requires|Cflags):' "${libdir}/pkgconfig/coolprop.pc" >&2
            exit 1
          fi

          cpp_cflags="$(pkg-config --define-variable=prefix="${root}" --cflags coolprop)"
          cpp_libs="$(pkg-config --define-variable=prefix="${root}" --libs coolprop)"
          echo "c++ cflags: ${cpp_cflags}"
          # shellcheck disable=SC2086
          c++ -std=c++17 "${COOLPROP_SRC}/dev/ci/cmake-consumer/cpp_api.cpp" \
            ${cpp_cflags} ${cpp_libs} -o "${work}/consumer_pc_cxx"
          LD_LIBRARY_PATH="${libdir}" "${work}/consumer_pc_cxx"

          echo "== via find_package(CoolProp) =="
          cat > "${work}/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.14)
          project(coolprop_consumer C)
          find_package(CoolProp REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE CoolProp::CoolProp)
          EOF
          cmake -S "${work}" -B "${work}/build" \
            -DCMAKE_PREFIX_PATH="${root}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "${work}/build"
          LD_LIBRARY_PATH="${libdir}" "${work}/build/consumer"

      - name: Upload the tarball
        uses: actions/upload-artifact@v7
        with:
          name: coolprop-source-tarball
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
