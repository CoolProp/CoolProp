name: Java Wrapper

on:
  push:
    branches: [ 'master', 'main', 'develop' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'master', 'main', 'develop' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

# Default the GITHUB_TOKEN to read-only; jobs that need more opt in explicitly.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sysname: Linux
          - os: windows-latest
            sysname: Windows
          - os: macos-latest
            sysname: Darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v6.0.0
        with:
          # The Java version to set up. Takes a whole or semver Java version. See examples of supported syntax in README file
          java-version: '25'
          # Java distribution. See the list of supported distributions in README file
          distribution: 'zulu'
          # The package type (jdk, jre, jdk+fx, jre+fx)
          java-package: 'jdk'

      - name: Install SWIG + 7zip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y swig p7zip-full

      - name: Install SWIG + 7zip (macOS)
        if: runner.os == 'macOS'
        run: brew install swig p7zip

      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        run: choco install swig -y --no-progress

      - name: Cache CPM packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cpm_cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: cmake -B build -S . -DCOOLPROP_JAVA_MODULE=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCOOLPROP_SWIG_OPTIONS="-package org.coolprop"

      - name: Build and install
        shell: bash
        # Bound parallelism to the core count.  A bare `-j` lets make spawn an
        # unlimited number of concurrent compiles (~60+ for the CoolProp lib),
        # which exhausts RAM on the 16 GB ubuntu runner and gets the runner
        # OOM-killed ("runner received a shutdown signal", exit 143).  Matches
        # every other wrapper workflow (library_shared, javascript, mathcad...).
        # `nproc` is Linux-only (and present in Git-Bash on Windows) but absent
        # on macOS, so fall back to `sysctl`, then a bounded constant.
        run: |
          JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
          cmake --build build --target install --config Release -j "$JOBS"

      - name: Run Java tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure -R Javatestbuild

      - name: JSON symbol-leak gate (Java native wrapper)
        # The SWIG Java module compiles the CoolProp sources (incl. the JSON
        # loaders) into CoolPropJava.{so,jnilib} — the same exposure the Octave
        # .oct carries, the wrapper where the hidden-visibility regression
        # (CoolProp-rj2i) bit. Assert the link-time export control keeps
        # nlohmann/valijson/rapidjson out of the wrapper's dynamic symbol table.
        # nm-based, so ELF/Mach-O only — the Windows PE .dll exports nothing by
        # default (opt-in .def) and is skipped.
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # The shared object keeps the platform 'lib' prefix on ELF/Mach-O
          # (PREFIX "" is Windows-only) → libCoolPropJava.{so,jnilib}. Include
          # the SONAME-versioned forms (libCoolPropJava.so.<ver>, the regular
          # file behind the symlink) so -type f still finds it if versioned.
          wrapper=$(find build install_root -type f \( -name '*CoolPropJava.so' -o -name '*CoolPropJava.so.*' -o -name '*CoolPropJava.jnilib' -o -name '*CoolPropJava.*.jnilib' \) | head -1)
          if [ -z "$wrapper" ]; then
            echo "FAIL: CoolPropJava shared object not found under build/ or install_root/" >&2
            exit 1
          fi
          echo "Gating $wrapper"
          ./dev/ci/check-json-symbols.sh "$wrapper"

      - name: Upload per-OS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Java-${{ matrix.sysname }}
          path: install_root/Java
          # upload-artifact defaults to 'warn', so a build that installed
          # nothing would upload no artifact and still pass, leaving the merge
          # job to assemble a Java tree missing that platform.
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    # delete-artifact removes the per-OS intermediates via the Actions API.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Download per-OS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Java-*
          path: staging

      - name: Assemble unified Java tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p Java
          shopt -s nullglob
          # An unmatched glob used to leave the literal 'staging/Java-*/' as the
          # loop's single iteration, so a download that produced nothing still
          # walked the body once and "succeeded".
          dirs=(staging/Java-*/)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::No per-OS Java artifacts were downloaded; nothing to merge."
            exit 1
          fi
          # Example.java, the archive and the unpacked package tree are
          # identical in all three per-OS artifacts -- that is what
          # "platform-independent" means -- so take them from the first and
          # collect only the native library directories from every artifact.
          # The copies are unconditional: they were guarded with
          # '[ -f ... ] && cp -n ... || true', which turned a missing file into
          # a silent skip and is the whole reason the published artifact
          # carried no wrapper sources (CoolProp-qrn3).  Copying once also
          # avoids depending on `cp -n`, whose exit status differs between GNU
          # (0 when it skips) and BSD (1) coreutils.
          first="${dirs[0]}"
          cp "${first}Example.java" Java/
          cp "${first}platform-independent.7z" Java/
          # The unpacked package tree was never copied at all, so even with the
          # archive present the sources beside it were missing.
          cp -R "${first}platform-independent" Java/
          for d in "${dirs[@]}"; do
            find "$d" -maxdepth 1 -type d -name '*bit' -exec cp -r {} Java/ \;
          done
          ls -R Java

      - name: Verify the assembled tree is complete
        shell: bash
        # Everything above can only fail on a file it actually touches.  This
        # step asserts the SHAPE of the result instead, so a future refactor
        # that quietly stops copying something is caught here rather than by a
        # user downloading an unusable Java/ folder.
        run: |
          set -euo pipefail
          fail=0
          note() { echo "::error::$1"; fail=1; }

          [ -f Java/Example.java ] || note "Java/Example.java is missing from the merged tree."
          [ -f Java/platform-independent.7z ] || note "Java/platform-independent.7z is missing from the merged tree."

          # The wrapper classes are the whole point of the artifact: native
          # libraries with nothing to call them are useless.  Check the
          # directory first rather than letting find fail under `set -e`, so a
          # tree missing it outright still reports every other problem too.
          if [ -d Java/platform-independent ]; then
            classes=$(find Java/platform-independent -name '*.java' -type f | wc -l)
          else
            note "Java/platform-independent is missing from the merged tree."
            classes=0
          fi
          if [ "$classes" -lt 2 ]; then
            note "Java/platform-independent holds $classes .java source(s); expected the full SWIG wrapper package."
          fi

          # One native library dir per per-OS artifact that fed the merge.
          expected=$(find staging -maxdepth 1 -type d -name 'Java-*' | wc -l)
          got=$(find Java -maxdepth 1 -type d -name '*bit' | wc -l)
          if [ "$got" -ne "$expected" ]; then
            note "Merged $got native library director(ies) from $expected per-OS artifact(s)."
          fi

          libs=$(find Java -maxdepth 2 -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.jnilib' -o -name '*.dll' \) | wc -l)
          if [ "$libs" -lt "$expected" ]; then
            note "Found $libs native librar(ies) across $expected platform director(ies)."
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Merged tree as assembled:" >&2
            find Java | sort >&2
            exit 1
          fi
          echo "OK: $classes wrapper sources, the archive, and $libs native librar(ies) across $expected platform(s)."

      - name: Upload unified Java artifact

        uses: actions/upload-artifact@v7
        with:
          name: Java
          path: Java
          if-no-files-found: error

      - name: Delete intermediate per-OS artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: Java-*
          
