name: Packaging (OBS build)

# Builds the release tarball, pushes it and the packaging recipes to the OBS
# package, and fails if any OBS target fails to build.  That last part is the
# point: it puts the openSUSE Build Service result into this repository's
# checks, next to the other CI jobs, instead of on a web page somebody has to
# remember to open.
#
# This replaces uploading the tarball and the spec by hand.  Both go up in the
# same run, so a spec change is always tested against the code it belongs with.
#
# It is NOT the OBS webhook.  The webhook fires when GitHub receives the push,
# which is before this job has built anything, so a webhook-triggered rebuild
# would report the PREVIOUS source against the new commit.  See the comment in
# .obs/workflows.yml.
#
# Setup, once, before this does anything (see dev/packaging/README.md):
#   Repository variables: OBS_PROJECT (e.g. home:jowr), OBS_PACKAGE (coolprop)
#                         OBS_APIURL is optional, defaults to opensuse.org
#   Repository secrets:   OBS_USERNAME, OBS_PASSWORD
# The job does not run at all until OBS_PROJECT is set, so the workflow is
# inert in a fork or in a clone that has no OBS package to push to.

on:
  push:
    branches: [ 'master', 'main', 'develop', 'chp/**', 'packaging/**' ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'dev/packaging/**'
      - 'dev/generate_headers.py'
      - '.github/workflows/packaging_obs.yml'
  workflow_dispatch:

concurrency:
  # One OBS package cannot build two commits at once, so runs are serialised.
  # An in-flight run is cancelled rather than queued: its upload is already
  # superseded by the newer one, and waiting for a build of source nobody will
  # ship wastes both runner and OBS time.
  group: packaging-obs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  obs-build:
    runs-on: ubuntu-latest
    # Opt-in.  An unset OBS_PROJECT means this repository has no OBS package
    # configured, which is a legitimate state and not a failure.  A project that
    # IS configured but has no credentials is a different thing entirely, and
    # obs-upload.sh fails loudly on it rather than skipping.
    if: vars.OBS_PROJECT != ''
    # The wait for OBS is unbounded in the script, so the bound lives here.
    # A full sweep across every target takes well under an hour in practice.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          # make-release-tarball.sh reads the version from the CMakeLists.txt of
          # the revision it exports, and uses git archive, so it needs history
          # rather than a shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # make-release-tarball.sh runs vendor-deps.sh, which drives a CMake
          # configure, and CMakeLists.txt requires a Python 3.9 or newer
          # interpreter.  Pinning it here rather than trusting the runner
          # default is what packaging_offline.yml does, for the same reason.
          python-version: '3.x'

      - name: Install osc
        # From PyPI, which is upstream's own package, NOT from apt.  Ubuntu
        # 24.04 ships osc 0.169.1, which is far too old for this job:
        #
        #   osc 1.6.0  reading credentials from environment variables
        #   osc 1.8.0  'results --fail-on-error/-F'
        #
        # Both are load-bearing here, so an apt osc would either prompt for a
        # password or never report a failing target.  Keep the pin at or above
        # those versions when bumping it.
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'osc==1.27.3'
          # 'osc --version' is not a valid invocation (it exits 2) and
          # 'osc version' talks to the server, so it asks for credentials.
          # '--help' is the smoke test that needs neither.
          osc --help > /dev/null
          python -m pip show osc | sed -n 's/^Version: /osc version: /p'

      - name: Check the recipes agree with each other
        # Cheap, and it catches the class of mistake that is most annoying to
        # debug from an OBS log: the spec, the .dsc and the Debian control file
        # disagreeing about a version or a build dependency.
        run: dev/packaging/check-build-deps.py

      - name: Build the release tarball
        run: |
          set -euo pipefail
          dev/packaging/make-release-tarball.sh --output-dir "${RUNNER_TEMP}/dist"
          ls -l "${RUNNER_TEMP}/dist"

      - name: Push to OBS and wait for the builds
        env:
          OSC_APIURL: ${{ vars.OBS_APIURL || 'https://api.opensuse.org' }}
          OSC_USERNAME: ${{ secrets.OBS_USERNAME }}
          OSC_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          # The project and package names go through the environment rather
          # than being pasted into the script body.  A ${{ }} expansion is
          # substituted before the shell ever sees the line, so a value with a
          # quote or a semicolon in it would become script rather than an
          # argument.  These particular values are set by a maintainer, but the
          # habit is what keeps the next one safe.
          OBS_PROJECT: ${{ vars.OBS_PROJECT }}
          OBS_PACKAGE: ${{ vars.OBS_PACKAGE || 'coolprop' }}
        run: |
          set -euo pipefail
          # Exactly one tarball is expected.  Globbing it into the argument
          # list without checking would pass two paths to --tarball on the day
          # a stale file survives, and the script would use only the first.
          mapfile -t tarballs < <(find "${RUNNER_TEMP}/dist" -maxdepth 1 -name 'coolprop-*.tar.gz' -type f | sort)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "::error::expected exactly one tarball, found ${#tarballs[@]}: ${tarballs[*]-none}"
            exit 1
          fi
          dev/packaging/obs-upload.sh \
            --tarball "${tarballs[0]}" \
            --project "${OBS_PROJECT}" \
            --package "${OBS_PACKAGE}"

      - name: Where to look
        if: always()
        env:
          OBS_APIURL: ${{ vars.OBS_APIURL || 'https://api.opensuse.org' }}
          OBS_PROJECT: ${{ vars.OBS_PROJECT }}
          OBS_PACKAGE: ${{ vars.OBS_PACKAGE || 'coolprop' }}
        run: |
          set -euo pipefail
          # The build logs live on the web UI, not on the API host.
          web="${OBS_APIURL/api./build.}"
          echo "OBS package: ${web%/}/package/show/${OBS_PROJECT}/${OBS_PACKAGE}" >> "${GITHUB_STEP_SUMMARY}"
