name: Release workflow run

on:
  push:
    branches: [ 'feature/automated_release' ]
  #   branches: [ 'master', 'main', 'develop', 'feature/automated_release' ]
  #   tags: [ 'v*' ]
  # pull_request:
  #   branches: [ 'master', 'main', 'develop' ]
  schedule:
    - cron: '0 2 * * *' # daily
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or tag to retrieve the binaries from'
        required: false
        default: 'master'

jobs:
  # release_job:    
  #   uses: ./.github/workflows/release_binaries.yml
  #   with:
  #     branch: master
  #     target: nightly
  
  # get_latest_tag:
  #   runs-on: ubuntu-latest
  #   outputs:
  #     tag: ${{ fromJson(steps.get_latest_release.outputs.data).tag_name }}
  #   steps:    
  #     - uses: octokit/request-action@v2.x
  #       id: get_latest_release
  #       with:
  #         route: GET /repos/{owner}/{repo}/releases/latest
  #         owner: coolprop
  #         repo: coolprop
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #     - run: "echo latest release id: ${{ fromJson(steps.get_latest_release.outputs.data).id }}"
  #     - run: "echo latest release tag: ${{ fromJson(steps.get_latest_release.outputs.data).tag_name }}"
  
  set_vars:
    runs-on: ubuntu-latest
    # This job only derives strings from the dispatch input; it makes no API
    # call, so it needs no token at all.  It is also the job an injected
    # payload would land in, so an empty token is the cheapest blast-radius
    # reduction available (CoolProp-4i70).
    permissions: {}
    outputs:
      branch: ${{ steps.propagate_vars.outputs.branch }}
      target: ${{ steps.propagate_vars.outputs.target }}
      webdir: ${{ steps.propagate_vars.outputs.webdir }}

    steps:
      - id: propagate_vars
        shell: bash
        # INPUT_BRANCH arrives through env instead of being interpolated into
        # the script body.  A ${{ }} expression is substituted into the shell
        # SOURCE TEXT before bash parses it, so the previous
        #     echo "BRANCH=${{ ... || inputs.branch }}" >> $GITHUB_ENV
        # executed a dispatch input of  x" ; <cmd> ; echo "  as shell code, in
        # a job holding a write-scoped GITHUB_TOKEN.  Through env it is data.
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          # Branch or tag to collect the binaries from; schedule/push events
          # carry no inputs at all, so an empty value means master.
          BRANCH="${INPUT_BRANCH:-master}"

          # Validate before the value reaches any other job.  branch, and the
          # target derived from it, are interpolated into run: blocks
          # downstream -- including the rsync destination in deploy_files,
          # which holds the SourceForge SSH key -- and are written to
          # GITHUB_OUTPUT, where an embedded newline would forge extra
          # outputs.  Restricting to git ref-name characters closes both.
          case "$BRANCH" in
            *[!A-Za-z0-9._/-]*)
              echo "::error::Refusing branch input '$BRANCH': only A-Z a-z 0-9 . _ / - are allowed in a ref name."
              exit 1
              ;;
          esac

          # The character class above still admits '..', '//', and a leading or
          # trailing '/', none of which are legal in a ref and all of which
          # traverse out of the rsync destination: BRANCH='../../foo' yields
          # TARGET='../../foo' and a destination of
          # /home/frs/project/coolprop/CoolProp/../../foo -> /home/frs/project/foo.
          # git's own validator is the authority on ref syntax; prefixing
          # refs/heads/ makes a single-level name like 'master' valid without
          # --allow-onelevel.  Both checks are needed and neither subsumes the
          # other: check-ref-format permits ';', '$', '&' and quotes, which
          # have no business in a path we interpolate into a shell command,
          # while the character class permits the traversal forms above.
          if ! git check-ref-format "refs/heads/$BRANCH"; then
            echo "::error::Refusing branch input '$BRANCH': not a well-formed git ref name."
            exit 1
          fi

          # Read a version number out of the ref if there is one, so that
          # 'v7.1.0' publishes to the 7.1.0 directory.  grep exits 1 when
          # nothing matches, which is the normal branch-name case, not an
          # error -- hence '|| true'.  Keep only the first match: grep -Eo
          # prints one line per match, and a multi-line value would corrupt
          # GITHUB_OUTPUT the same way a newline in the input would.
          TARGET="$(printf '%s' "$BRANCH" | grep -Eo '[0-9]+(\.[0-9]+)*' || true)"
          TARGET="${TARGET%%$'\n'*}"

          # No version in the name: master publishes as the nightly, any other
          # branch publishes under its own name.
          if [ -z "$TARGET" ]; then
            if [ "$BRANCH" = "master" ]; then
              TARGET="nightly"
            else
              TARGET="$BRANCH"
            fi
          fi

          # Nightlies go to the 'dev' subdirectory of the web root, releases
          # to the root itself.
          if [ "$TARGET" = "nightly" ]; then
            WEBDIR="dev"
          else
            WEBDIR="."
          fi

          echo "branch=$BRANCH  target=$TARGET  webdir=$WEBDIR"
          {
            echo "branch=$BRANCH"
            echo "target=$TARGET"
            echo "webdir=$WEBDIR"
          } >> "$GITHUB_OUTPUT"


  # Single source of truth for the builder workflows whose artifacts make up a
  # release, and a preflight that every one of them still exists on the target
  # branch.  Without this, deleting or renaming a builder makes the matching
  # collect_binaries leg die with a bare "Not Found" annotation from
  # action-download-artifact and takes the whole deploy down with it -- which is
  # exactly how gh#3315 went unnoticed for six weeks after PR #3245 renamed
  # csharp_builder.yml into java_builder.yml.
  list_builders:
    needs: [set_vars]
    name: Resolve the builder workflow list
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      workflows: ${{ steps.resolve.outputs.workflows }}
    steps:

      - name: Fetch the sources
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.set_vars.outputs.branch }}

      - name: Resolve and validate the builder list
        id: resolve
        shell: bash
        # BRANCH goes through env rather than being interpolated into the
        # script body, so a crafted workflow_dispatch input cannot inject shell.
        env:
          BRANCH: ${{ needs.set_vars.outputs.branch }}
        run: |
          set -euo pipefail
          # Add a builder here to have its artifacts included in the release.
          # Every entry must name a file under .github/workflows/.
          builders=(
            javascript_builder.yml
            library_shared.yml
            windows_installer.yml
            docs_docker-run.yml
            libreoffice_builder.yml
            mathcad_builder.yml
            csharp_builder.yml
            java_builder.yml
            # python_buildwheels.yml -- wheels ship via PyPI, not the file drop
          )
          # An all-commented-out list would otherwise sail through every check
          # below, hand collect_binaries an empty matrix, and let deploy_files
          # publish a release containing nothing but the source zip.
          if [ "${#builders[@]}" -eq 0 ]; then
            echo "::error::The builders list in release_all_files.yml is empty; there would be no binaries to release."
            exit 1
          fi
          missing=()
          for wf in "${builders[@]}"; do
            if [ -f ".github/workflows/$wf" ]; then
              echo "found   $wf"
            else
              echo "MISSING $wf"
              missing+=("$wf")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Builder workflows listed by release_all_files.yml do not exist on '${BRANCH}': ${missing[*]}. A builder was renamed, deleted, or never landed on this branch; fix the file or update the builders list in release_all_files.yml."
            exit 1
          fi
          # jq --args quotes each element for us, so the JSON stays valid no
          # matter what ends up in the list.  Assign first rather than inlining
          # the substitution into echo: `echo "x=$(jq ...)"` exits 0 even when
          # jq dies, which would emit an empty output and fail downstream with
          # an unrelated fromJSON error.  A bare assignment propagates jq's
          # status, so `set -e` stops here instead.
          workflows=$(jq -cn '$ARGS.positional' --args "${builders[@]}")
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

  collect_binaries:
    needs: [set_vars, list_builders]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        workflow: ${{ fromJSON(needs.list_builders.outputs.workflows) }}
    uses: ./.github/workflows/release_get_artifact.yml
    with:
      branch: ${{ needs.set_vars.outputs.branch }}
      workflow: ${{ matrix.workflow }}

  prepare_sources:
    needs: [set_vars]
    name: Prepare the source code
    runs-on: ubuntu-latest    
    steps:
    
    - name: Fetch the sources
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.set_vars.outputs.branch }}
        path: source
        
    - name: Update the headers
      run: |
        pushd source
        git reset --hard HEAD
        python "dev/generate_headers.py"
        find . -iwholename "*/.git*" -prune -exec rm -rf {} \;
        popd
        zip -rq CoolProp_sources.zip source
        mkdir -p binaries/source
        mv CoolProp_sources.zip binaries/source/
        
    - name: Store artifacts
      uses: actions/upload-artifact@v7
      with:
        name: binaries-source
        path: binaries
        retention-days: 1


  deploy_files:
    needs: [set_vars, collect_binaries, prepare_sources]  # prepare_mathcad
    name: Deploy collected files
    runs-on: ubuntu-latest
    steps:  
    
    - name: Download binaries
      uses: actions/download-artifact@v8
      with:
        # Get all unique artifacts starting with "binaries-" per the pattern
        # per requirements of actions/download-artifact@v8
        pattern: binaries-*
        # Allow multiple artifacts matching the patter to be merged
        # into the same binaries directory.
        merge-multiple: true
        path: binaries
        
    - name: Create info files
      run: |
        echo    "CoolProp ${{ needs.set_vars.outputs.target }} binaries"                    > binaries/README.rst.txt
        echo    "-------------------------"                                                >> binaries/README.rst.txt
        echo -n "Binaries of the \`CoolProp project <http://coolprop.sourceforge.net>\`_ " >> binaries/README.rst.txt
        echo    "updated on $(date +%F) at $(date +%X) $(date +%Z)."                       >> binaries/README.rst.txt
        cat binaries/README.rst.txt
        mkdir -p binaries/Python
        echo "Please use the following commands to install CoolProp for Python:"         > binaries/Python/README.txt
        echo "nightly: python -m pip install -i https://test.pypi.org/simple/ CoolProp" >> binaries/Python/README.txt
        echo "release: python -m pip install --upgrade CoolProp"                        >> binaries/Python/README.txt
        cat binaries/Python/README.txt
        
    - name: Display structure of downloaded files
      run: |
        set -x
        ls -R
        du -sh
        
    - name: Install SSH key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SF_SSH_KEY }}
        name: id_rsa-${{ secrets.SF_SSH_USER }}
        known_hosts: ${{ secrets.SF_HOST_KEYS }}
        config: |
          Host frs.sf.net-${{ secrets.SF_SSH_USER }}
            HostName frs.sf.net
            User ${{ secrets.SF_SSH_USER }}
            IdentityFile ~/.ssh/id_rsa-${{ secrets.SF_SSH_USER }}
            PubkeyAcceptedKeyTypes +ssh-rsa
        if_key_exists: fail # replace / ignore / fail; optional (defaults to fail)
        
    - name: Fix the docs
      run: |
        rm -rf binaries/github-pages
        tar -xzf binaries/docs/*documentation*.tar.gz
        mkdir -p html/v4
        rsync frs.sf.net-${{ secrets.SF_SSH_USER }}:/home/frs/project/coolprop/CoolProp/4.2.5/coolpropv425docs.zip coolpropv4docs.zip
        unzip -qo coolpropv4docs.zip -d html/v4
        zip -rq documentation.zip html
        rm -rf binaries/docs/*
        mv documentation.zip binaries/docs/        
    
    - name: Upload using rsync over SSH
      run: |
        RSYNC_DRY_RUN=
        RSYNC_OPTS="-a --chmod=Dug=rwx,Do=rx,Fug=rw,Fo=r -z --stats --delete"
        rsync $RSYNC_DRY_RUN $RSYNC_OPTS "binaries/" frs.sf.net-${{ secrets.SF_SSH_USER }}:/home/frs/project/coolprop/CoolProp/${{ needs.set_vars.outputs.target }}
        rsync $RSYNC_DRY_RUN $RSYNC_OPTS "html/"     frs.sf.net-${{ secrets.SF_SSH_USER }}:/home/project-web/coolprop/htdocs/${{ needs.set_vars.outputs.webdir }}
