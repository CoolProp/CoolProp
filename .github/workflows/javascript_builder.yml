name: Javascript library

on:
  push:
    branches: [ 'master', 'main', 'develop', 'actions_javascript' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'master', 'main', 'develop' ]
  workflow_dispatch:
    inputs:
      npm_dry_run:
        description: 'Only run npm publish --dry-run (no upload to the registry)'
        required: false
        type: boolean
        default: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

concurrency:
  # Cancel superseded runs on the same ref to cut CI backlog on heavy
  # dev days (repeated pushes to an open PR).  Protected: master / main
  # / develop and tags never cancel, so mainline + release runs always
  # complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk@sha256:744fb6a68941970951bacf9d6632041a0398260492232691ef22bbf54b0585c6 # 4.0.12
      options: --user 1001

    steps:
    - uses: actions/checkout@v7

    - name: Cache CPM packages
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cpm_cache
        key: cpm-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}
        restore-keys: |
          cpm-${{ runner.os }}-

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake -DCOOLPROP_JAVASCRIPT_MODULE:BOOL=ON -DCMAKE_BUILD_TYPE=$BUILD_TYPE
      # cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake -DCOOLPROP_JAVASCRIPT_MODULE:BOOL=ON -DEMSCRIPTEN_INIT_FLAG:BOOL=OFF -DCMAKE_BUILD_TYPE=$BUILD_TYPE
      # cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake -DCOOLPROP_JAVASCRIPT_MODULE:BOOL=ON -DEMSCRIPTEN_INIT_FLAG:BOOL=ON  -DCMAKE_BUILD_TYPE=RelWithDebInfo

    - name: Build
      shell: bash
      run: |
        set -x
        cmake --build build --target install -j $(nproc) --config $BUILD_TYPE

    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Test
      shell: bash
      run: |
        set -x
        cd build
        cp ../wrappers/Javascript/test_wasm.mjs .
        node test_wasm.mjs

    - name: Archive artifacts
      if: ${{ !env.ACT }} # skip during local actions testing
      uses: actions/upload-artifact@v7
      with:
          name: Javascript
          path: install_root/Javascript

    # - name: Upload TGZ or ZIP to release
    #   if: contains(github.ref, 'refs/tags')
    #   uses: svenstaro/upload-release-action@v2
    #   with:
    #     repo_token: ${{ secrets.GITHUB_TOKEN }}
    #     dir: install_root/Javascript
    #     tag: ${{ github.ref }}
    #     overwrite: true
    #     file_glob: false

  # Publishes the staged install tree (install_root/Javascript contains
  # coolprop.js, coolprop.wasm, package.json, README.md, coolprop.d.ts and
  # LICENSE) to npm as the 'coolprop' package -- gh discussion #2665.
  # Requires the NPM_TOKEN repository secret (an npm granular access token
  # with publish rights on the package).  Tag builds publish to the 'latest'
  # dist-tag; manual dispatch runs dry-run by default, and a non-tag manual
  # publish goes to the 'dev' dist-tag so `npm install coolprop` keeps
  # tracking releases.
  publish_npm:
    name: Publish to npm
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for npm publish --provenance
    steps:
    - name: Download the packaged module
      uses: actions/download-artifact@v7
      with:
        name: Javascript
        path: npm_pkg

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org

    - name: Publish to npm
      working-directory: npm_pkg
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_dry_run }}
      run: |
        set -euo pipefail
        # npm requires an explicit --tag when the version is a prerelease
        # (e.g. 8.0.1-dev.0 from a dev/master build); tag builds carry a final
        # version and go to the default 'latest' dist-tag.
        version=$(node -p "require('./package.json').version")
        if [ "$DRY_RUN" = "true" ]; then
          echo "Dry run only: packaging checked, nothing is uploaded"
          if [ "$IS_TAG" = "true" ]; then
            npm publish --dry-run
          else
            npm publish --dry-run --tag dev
          fi
        elif [ "$IS_TAG" = "true" ]; then
          npm publish --access public --provenance
        else
          npm publish --access public --provenance --tag dev
        fi
